<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque & Encomendas - Festejo de Santa Rita</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6b0f1a;
      --primary-dark: #4a0911;
      --secondary: #b38728;
      --secondary-light: #f3e5ab;
      --bg: #f8f6f2;
      --surface: #ffffff;
      --text: #2c2c2c;
      --text-light: #666666;
      --danger: #c0392b;
      --warning: #d35400;
      --success: #27ae60;
      --border-radius: 12px;
      --shadow: 0 4px 15px rgba(107, 15, 26, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
      color: white;
      padding: 2.5rem 1rem;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      position: relative;
    }

    header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--secondary), var(--secondary-light), var(--secondary));
    }

    .header-content { max-width: 900px; margin: 0 auto; }
    h1 { font-family: 'Cinzel', serif; font-size: 1.8rem; margin-bottom: 0.5rem; letter-spacing: 1px; }
    .subtitle { font-size: 0.95rem; opacity: 0.9; font-weight: 400; }

    main {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      flex: 1;
    }

    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .sync-btn {
      background-color: var(--secondary);
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(179, 135, 40, 0.3);
    }

    .sync-btn:hover { background-color: #966f1e; transform: translateY(-1px); }

    .status-badge {
      font-size: 0.85rem;
      color: var(--text-light);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--success);
    }

    .stats-card {
      background-color: var(--surface);
      border-radius: var(--border-radius);
      padding: 1.25rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 1rem;
      text-align: center;
      border-left: 4px solid var(--primary);
    }

    .stat-item .value { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
    .stat-item .label { font-size: 0.75rem; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; }

    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.2rem;
    }

    .card {
      background-color: var(--surface);
      border-radius: var(--border-radius);
      padding: 1.25rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid rgba(0,0,0,0.05);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 4px;
      background-color: var(--primary);
    }

    .card.low-stock::before { background-color: var(--warning); }
    .card.out-of-stock::before { background-color: var(--danger); }

    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .size-title { font-size: 1.3rem; font-weight: 700; color: var(--text); }

    .stock-status {
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-ok { background-color: #e8f8f0; color: var(--success); }
    .status-low { background-color: #fef5e7; color: var(--warning); }
    .status-out { background-color: #fadbd8; color: var(--danger); }

    .details-list {
      font-size: 0.85rem;
      color: var(--text-light);
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .details-row {
      display: flex;
      justify-content: space-between;
    }

    .available-box {
      background-color: #fdfaf3;
      border: 1px solid var(--secondary-light);
      border-radius: 8px;
      padding: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .available-box .label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
    }

    .available-box .qty {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
    }

    .out-of-stock .available-box .qty {
      color: var(--danger);
    }

    .loading-spinner {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    footer { text-align: center; padding: 1.5rem; font-size: 0.8rem; color: var(--text-light); margin-top: auto; }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <h1>Festejo de Santa Rita de Cássia</h1>
      <p class="subtitle">Controle Integrado de Estoque, Produção e Reservas</p>
    </div>
  </header>

  <main>
    <div class="actions-bar">
      <button class="sync-btn" onclick="carregarEstoque()">
        <span id="sync-icon">🔄</span> Sincronizar Estoque
      </button>
      <div class="status-badge">
        <span class="status-dot" id="status-dot"></span>
        <span id="last-updated">Carregando...</span>
      </div>
    </div>

    <div class="stats-card">
      <div class="stat-item">
        <div class="value" id="total-fisico">0</div>
        <div class="label">Estoque Físico</div>
      </div>
      <div class="stat-item">
        <div class="value" id="total-producao">0</div>
        <div class="label">Em Produção</div>
      </div>
      <div class="stat-item">
        <div class="value" id="total-reservas">0</div>
        <div class="label">Pedidos Reservados</div>
      </div>
      <div class="stat-item">
        <div class="value" id="total-disponivel" style="color: var(--success);">0</div>
        <div class="label">Livre pra Vender</div>
      </div>
    </div>

    <div class="inventory-grid" id="inventory-grid"></div>
  </main>

  <footer>
    Festejo de Santa Rita de Cássia • Sistema de Gestão de Estoque
  </footer>

  <script>
    async function carregarEstoque() {
      const syncIcon = document.getElementById('sync-icon');
      const statusDot = document.getElementById('status-dot');
      const lastUpdated = document.getElementById('last-updated');
      
      syncIcon.innerHTML = '<span class="loading-spinner"></span>';

      try {
        const response = await fetch(`estoque.json?v=${new Date().getTime()}`);
        
        if (!response.ok) {
          throw new Error('Não foi possível carregar o arquivo estoque.json');
        }

        const data = await response.json();
        const estoque = data.itens || [];
        const dataJson = data.ultima_atualizacao;

        renderizarEstoque(estoque);

        statusDot.style.backgroundColor = 'var(--success)';
        const agora = new Date();
        const horaAtual = agora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const dataExibicao = dataJson ? dataJson : agora.toLocaleDateString('pt-BR');

        lastUpdated.textContent = `Atualizado em ${dataExibicao} às ${horaAtual}`;
      } catch (error) {
        console.error("Erro:", error);
        statusDot.style.backgroundColor = 'var(--danger)';
        lastUpdated.textContent = "Erro ao sincronizar";
      } finally {
        syncIcon.textContent = '🔄';
      }
    }

    function renderizarEstoque(estoque) {
      const grid = document.getElementById('inventory-grid');
      grid.innerHTML = '';

      let sumFisico = 0;
      let sumProducao = 0;
      let sumReservas = 0;
      let sumDisponivel = 0;

      estoque.forEach(item => {
        const fisico = item.fisico || 0;
        const producao = item.producao || 0;
        const reservado = item.reservado || 0;
        
        // Fórmula: (Físico + Produção) - Reservados
        const disponivel = (fisico + producao) - reservado;

        sumFisico += fisico;
        sumProducao += producao;
        sumReservas += reservado;
        sumDisponivel += Math.max(0, disponivel);

        let statusClass = 'status-ok';
        let statusText = 'Livre';
        let cardClass = '';

        if (disponivel <= 0) {
          statusClass = 'status-out';
          statusText = 'Sem Saldo';
          cardClass = 'out-of-stock';
        } else if (disponivel <= 2) {
          statusClass = 'status-low';
          statusText = 'Restam Poucas';
          cardClass = 'low-stock';
        }

        const card = document.createElement('div');
        card.className = `card ${cardClass}`;
        card.innerHTML = `
          <div>
            <div class="card-header">
              <span class="size-title">${item.tamanho}</span>
              <span class="stock-status ${statusClass}">${statusText}</span>
            </div>

            <div class="details-list">
              <div class="details-row">
                <span>Estoque físico (atual):</span>
                <strong>${fisico} un.</strong>
              </div>
              <div class="details-row">
                <span>Em Produção:</span>
                <strong>+${producao} un.</strong>
              </div>
              <div class="details-row">
                <span>Pedidos Reservados:</span>
                <strong style="color: var(--danger);">- ${reservado} un.</strong>
              </div>
            </div>
          </div>

          <div class="available-box">
            <span class="label">Pode Vender:</span>
            <span class="qty">${disponivel} <small style="font-size:0.8rem;">un.</small></span>
          </div>
        `;

        grid.appendChild(card);
      });

      document.getElementById('total-fisico').textContent = sumFisico;
      document.getElementById('total-producao').textContent = sumProducao;
      document.getElementById('total-reservas').textContent = sumReservas;
      document.getElementById('total-disponivel').textContent = sumDisponivel;
    }

    window.addEventListener('DOMContentLoaded', carregarEstoque);
  </script>
</body>
</html>
